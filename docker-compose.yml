services:
  preflight-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: archive-path-preflight:latest
    container_name: archive-path-preflight
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import json,urllib.request;r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5);assert json.load(r)['status']=='ok'"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
